name: Isolated pilot backend validation
on:
  push:
    branches: [feature/offline-pilot-render-guard]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: pilot_ci
          POSTGRES_USER: pilot_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pilot_ci -d pilot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SECRET_KEY: synthetic-ci-secret-never-production-0123456789
      DEBUG: 'true'
      DATABASE_URL: postgresql://pilot_ci:synthetic-ci-only@127.0.0.1:5432/pilot_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.2'
      - run: python -m pip install -r requirements.txt
      - run: python tool/test_pilot_policy.py
      - run: python tool/test_pilot_identity.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
