name: Development validation
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targeted-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: elevage_test
          POSTGRES_PASSWORD: synthetic-ci-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U elevage_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python tools/guard_push.py --check
      - run: python tools/test_local.py --ci-postgres
